name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: delivery-fe-ec2-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://ci.example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] && [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Missing host secret: set EC2_HOST or SSH_HOST in the production environment"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing SSH key secret: set EC2_SSH_KEY or SSH_PRIVATE_KEY in the production environment"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          else
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CFG'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 120
            TCPKeepAlive yes
          CFG

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
        run: |
          success=false
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              success=true
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "ssh-keyscan failed for host (check EC2 security group port 22)"
            exit 1
          fi

      - name: Start build on EC2 (detached)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            -i ~/.ssh/id_ed25519 ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e
            cd /home/ubuntu/grubdelivery-frontend
            git fetch origin main
            git clean -fd -e '.env*'
            git reset --hard origin/main
            LOG=/tmp/delivery-fe-deploy-prod.log
            PIDFILE=/tmp/delivery-fe-deploy-prod.pid
            rm -f "$LOG" "$PIDFILE"
            nohup bash -c '
              set -e
              cd /home/ubuntu/grubdelivery-frontend
              set -a
              source .env.production
              set +a
              export FE_CONTAINER_NAME=grub-delivery-frontend
              export FE_HOST_PORT=3010
              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1
              docker compose -p grubdelivery-fe-prod -f docker-compose.frontend.yml build
              docker compose -p grubdelivery-fe-prod -f docker-compose.frontend.yml up -d
            ' > "$LOG" 2>&1 &
            echo $! > "$PIDFILE"
            echo "Deploy started (pid $(cat "$PIDFILE"))"
          EOF

      - name: Wait for frontend ready
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          SSH="ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -i ~/.ssh/id_ed25519 ${EC2_USER}@${EC2_HOST}"
          ready=false
          for i in $(seq 1 40); do
            if $SSH "curl -sf http://127.0.0.1:3010/ >/dev/null"; then
              ready=true
              break
            fi
            if $SSH "test -f /tmp/delivery-fe-deploy-prod.pid && kill -0 \$(cat /tmp/delivery-fe-deploy-prod.pid) 2>/dev/null"; then
              echo "build still running (attempt $i)..."
            else
              echo "deploy script finished, waiting for frontend HTTP (attempt $i)..."
            fi
            sleep 15
          done
          if [ "$ready" != "true" ]; then
            echo "frontend health check failed on port 3010"
            $SSH "tail -100 /tmp/delivery-fe-deploy-prod.log" || true
            $SSH "docker logs grub-delivery-frontend --tail 50" || true
            exit 1
          fi

      - name: Done
        run: echo "Delivery frontend deployed successfully to production"
