name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SSH host
        id: ssh
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "host=${{ secrets.SSH_HOST }}" >> "$GITHUB_OUTPUT"
          else
            # Pilot: hardcoded host — move to SSH_HOST secret when EC2 slot is formalized
            echo "host=13.127.79.155" >> "$GITHUB_OUTPUT"
            echo "::notice title=SSH_HOST not set::Using hardcoded pilot host 13.127.79.155 — configure SSH_HOST secret when ready"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa -H ${{ steps.ssh.outputs.host }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via Docker
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=20 -o ConnectTimeout=300 -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa ubuntu@${{ steps.ssh.outputs.host }} << 'DEPLOY_EOF'
            set -e
            cd ~/grubFood-frontend
            git pull origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          DEPLOY_EOF

      - name: Health check
        run: |
          sleep 20
          curl -sf http://${{ steps.ssh.outputs.host }} || (echo "Health check failed, check container logs" && exit 1)

      - name: Done
        run: echo "Delivery frontend deployed successfully to production"
