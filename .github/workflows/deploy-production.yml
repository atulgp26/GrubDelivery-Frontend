name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: delivery-fe-ec2-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://ci.example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] && [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Missing host secret: set EC2_HOST or SSH_HOST in the production environment"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing SSH key secret: set EC2_SSH_KEY or SSH_PRIVATE_KEY in the production environment"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          else
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CFG'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 120
            TCPKeepAlive yes
          CFG

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
        run: |
          success=false
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              success=true
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "ssh-keyscan failed for host (check EC2 security group port 22)"
            exit 1
          fi

      - name: Blue-green deploy Delivery FE on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            -i ~/.ssh/id_ed25519 ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -euo pipefail
            BG_SCRIPT="/home/ubuntu/scripts/bluegreen-prod-delivery-fe.sh"
            if [ ! -x "$BG_SCRIPT" ]; then
              echo "Missing $BG_SCRIPT — sync from GrubAdmin-Backend scripts/ec2/ first"
              exit 1
            fi

            INACTIVE_COLOR="$("$BG_SCRIPT" inactive-color)"
            INACTIVE_PORT="$("$BG_SCRIPT" inactive-port)"
            INACTIVE_PROJECT="$("$BG_SCRIPT" inactive-project)"
            INACTIVE_CONTAINER="$("$BG_SCRIPT" inactive-container)"
            ACTIVE_COLOR="$("$BG_SCRIPT" active-color)"

            echo "=== Delivery FE blue-green: candidate=${INACTIVE_COLOR} port=${INACTIVE_PORT} project=${INACTIVE_PROJECT} ==="
            echo "=== Active until cutover: ${ACTIVE_COLOR} ==="

            cd /home/ubuntu/grubdelivery-frontend
            git fetch origin main
            git clean -fd -e '.env*'
            git reset --hard origin/main

            LOG=/tmp/delivery-fe-deploy-prod-bg.log
            PIDFILE=/tmp/delivery-fe-deploy-prod-bg.pid
            rm -f "$LOG" "$PIDFILE"

            nohup bash -c "
              set -euo pipefail
              cd /home/ubuntu/grubdelivery-frontend
              set -a
              # shellcheck disable=SC1091
              source .env.production
              set +a
              export FE_CONTAINER_NAME=${INACTIVE_CONTAINER}
              export FE_HOST_PORT=${INACTIVE_PORT}
              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1
              docker compose -p ${INACTIVE_PROJECT} -f docker-compose.frontend.yml build
              docker compose -p ${INACTIVE_PROJECT} -f docker-compose.frontend.yml up -d
            " > "$LOG" 2>&1 &
            echo $! > "$PIDFILE"
            echo "Candidate build started (pid $(cat "$PIDFILE"))"

            ready=false
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${INACTIVE_PORT}/" || true)
              if echo "$code" | grep -Eq '^(2|3)[0-9][0-9]$'; then
                ready=true
                break
              fi
              if test -f "$PIDFILE" && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
                echo "build still running (attempt $i, last=${code})..."
              else
                echo "deploy script finished, waiting for candidate HTTP (attempt $i, last=${code})..."
              fi
              sleep 15
            done
            if [ "$ready" != "true" ]; then
              echo "Candidate Delivery FE health failed on :${INACTIVE_PORT}"
              tail -100 "$LOG" || true
              docker logs "$INACTIVE_CONTAINER" --tail 50 || true
              exit 1
            fi

            "$BG_SCRIPT" cutover "$INACTIVE_COLOR"
            echo "=== Keep previous slot as warm standby (no stop) ==="
            "$BG_SCRIPT" status
            echo "=== Delivery FE blue-green deploy complete ==="
          EOF

      - name: Done
        run: echo "Delivery frontend blue-green deployed successfully to production"
